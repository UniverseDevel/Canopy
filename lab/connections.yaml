# Canopy connection presets for the local lab (lab/README.md).
#
# Read-only: Canopy loads this file with --connections lab/connections.yaml (the IDE run
# configurations in .run/ do that), lists these presets next to your own, and never
# writes to it. Relative paths are relative to this folder.
#
# Passwords are never stored. These presets read the password from GNMI_PASSWORD
# (the IDE run configurations set it to the SR Linux lab default).
#
# Everything here is relative to this folder, so it works on any machine. Needs:
# the lab node (lab/operator/lab.sh node or up), which also exports its CA to
# lab/.tls/ca.pem; and for the jump
# preset the SSH jump host (lab.sh jumphost), which creates the key lab/.ssh/.
version: 1
connections:
  - name: lab-srl1
    description: SR Linux lab node, TLS without verification (the everyday setting)
    tags: [lab, srlinux]
    address: 127.0.0.1:57400
    skipVerify: true
    username: admin
    encoding: json_ietf
    paths:
      - /system/information
      - /system/name
      - /interface[name=mgmt0]/oper-state

  - name: lab-srl1-verified
    description: SR Linux lab node, TLS verified against the containerlab CA (regenerated on lab redeploy, same path)
    tags: [lab, srlinux, tls]
    address: 127.0.0.1:57400
    caFile: .tls/ca.pem              # exported by lab.sh (node, up, ca)
    serverName: srl1.canopy-dev.io   # the certificate isn't valid for 127.0.0.1
    username: admin
    encoding: json_ietf
    paths:
      - /system/information

  - name: lab-srl1-jump
    description: SR Linux on its lab network address, through the WSL SSH jump host (like a device behind a bastion)
    tags: [lab, srlinux, ssh]
    address: 172.20.20.2:57400
    caFile: .tls/ca.pem              # the certificate is valid for 172.20.20.2
    username: admin
    jumps: [canopy@127.0.0.1:2222]   # lab.sh jumphost
    identityFiles: [.ssh/canopy_lab_ed25519]
    encoding: json_ietf
    paths:
      - /system/information
      - /network-instance[name=mgmt]/interface
