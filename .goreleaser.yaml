version: 2
project_name: canopy
builds:
  - main: ./cmd/canopy
    env: [CGO_ENABLED=0]
    goos: [darwin, windows, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/UniverseDevel/Canopy/internal/buildinfo.Version={{.Version}}
      - -X github.com/UniverseDevel/Canopy/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/UniverseDevel/Canopy/internal/buildinfo.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
